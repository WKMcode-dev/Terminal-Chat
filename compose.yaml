services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: terminal_chat
      POSTGRES_USER: terminal_chat
      POSTGRES_PASSWORD: terminal_chat
    ports:
      - "5432:5432"
    volumes:
      - terminal-chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal_chat -d terminal_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  terminal-chat-postgres:
