[package]
name = "terminal-chat"
version = "2.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
cpal = "0.18.1"
crossterm = "0.29.0"
futures-util = "0.3.33"
keyring = "4.1.6"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
